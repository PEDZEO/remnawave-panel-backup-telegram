<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Remnawave Panel Backup Manager</title>
  <desc id="desc">A thematic banner showing Remnawave, Bedolaga, Docker, backups, Telegram delivery, timers and server diagnostics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.42" stop-color="#0d2735"/>
      <stop offset="0.72" stop-color="#123224"/>
      <stop offset="1" stop-color="#2a1f14"/>
    </linearGradient>
    <linearGradient id="panel" x1="70" y1="54" x2="1130" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10243a"/>
      <stop offset="0.5" stop-color="#0b1a2a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flow" x1="267" y1="242" x2="1012" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.45" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="archive" x1="594" y1="143" x2="755" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16a34a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="telegram" x1="1018" y1="106" x2="1138" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#dbeafe" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.33"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.75 0 0 0 0 0.95 0 0 0 0.42 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="32" fill="url(#grid)"/>
  <path d="M0 330C151 290 259 332 413 259C565 187 634 82 819 122C985 158 1072 273 1280 206V420H0V330Z" fill="#0f766e" opacity="0.16"/>
  <path d="M58 338C225 288 322 312 462 248C613 179 702 145 857 178C997 208 1083 206 1220 140" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" opacity="0.82"/>
  <path d="M58 338C225 288 322 312 462 248C613 179 702 145 857 178C997 208 1083 206 1220 140" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.035"/>

  <g filter="url(#shadow)">
    <rect x="56" y="48" width="1168" height="324" rx="28" fill="url(#panel)" stroke="#244258"/>
    <rect x="56" y="48" width="1168" height="58" rx="28" fill="#0e2134" stroke="#244258"/>
    <circle cx="93" cy="77" r="7" fill="#ef4444"/>
    <circle cx="119" cy="77" r="7" fill="#f59e0b"/>
    <circle cx="145" cy="77" r="7" fill="#22c55e"/>
    <text x="178" y="83" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">/usr/local/bin/panel-backup-manager</text>
    <text x="1134" y="83" fill="#86efac" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">systemd ready</text>
  </g>

  <g>
    <text x="92" y="158" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Remnawave</text>
    <text x="92" y="199" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="750">Backup Manager</text>
    <text x="92" y="234" fill="#93a9bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">panel, bedolaga, node, restore, migration</text>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
      <rect x="92" y="265" width="102" height="34" rx="10" fill="#0f766e"/>
      <text x="143" y="287" fill="#ecfeff" text-anchor="middle">backup</text>
      <rect x="204" y="265" width="94" height="34" rx="10" fill="#1d4ed8"/>
      <text x="251" y="287" fill="#eff6ff" text-anchor="middle">restore</text>
      <rect x="308" y="265" width="104" height="34" rx="10" fill="#b45309"/>
      <text x="360" y="287" fill="#fffbeb" text-anchor="middle">telegram</text>
      <rect x="92" y="309" width="116" height="34" rx="10" fill="#7c3aed"/>
      <text x="150" y="331" fill="#f5f3ff" text-anchor="middle">migration</text>
      <rect x="218" y="309" width="100" height="34" rx="10" fill="#0369a1"/>
      <text x="268" y="331" fill="#f0f9ff" text-anchor="middle">doctor</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="448" y="142" width="146" height="170" rx="18" fill="#081827" stroke="#2b4a63"/>
    <rect x="472" y="166" width="98" height="22" rx="7" fill="#12344a"/>
    <rect x="472" y="201" width="98" height="22" rx="7" fill="#12344a"/>
    <rect x="472" y="236" width="98" height="22" rx="7" fill="#12344a"/>
    <circle cx="487" cy="177" r="5" fill="#22c55e"/>
    <circle cx="487" cy="212" r="5" fill="#38bdf8"/>
    <circle cx="487" cy="247" r="5" fill="#f59e0b"/>
    <text x="521" y="291" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">VPS</text>
    <text x="521" y="121" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Remnawave</text>
  </g>

  <g filter="url(#glow)" stroke="url(#flow)" stroke-width="4" stroke-linecap="round">
    <path d="M596 219H640"/>
    <path d="M735 219H803"/>
    <path d="M902 202H988"/>
    <path d="M902 238H988"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="636" y="146" width="104" height="136" rx="18" fill="url(#archive)" stroke="#67e8f9" stroke-opacity="0.36"/>
    <path d="M656 175H720" stroke="#bbf7d0" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
    <path d="M656 205H720" stroke="#dcfce7" stroke-width="8" stroke-linecap="round" opacity="0.92"/>
    <path d="M656 235H704" stroke="#ecfccb" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
    <path d="M672 126H704L716 146H660L672 126Z" fill="#134e4a" stroke="#5eead4"/>
    <text x="688" y="307" fill="#d1fae5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">backup archive</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="806" y="128" width="112" height="184" rx="18" fill="#0b1728" stroke="#2b4a63"/>
    <rect x="828" y="154" width="68" height="28" rx="8" fill="#0f766e"/>
    <rect x="828" y="197" width="68" height="28" rx="8" fill="#1d4ed8"/>
    <rect x="828" y="240" width="68" height="28" rx="8" fill="#b45309"/>
    <text x="862" y="174" fill="#ecfeff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">DB</text>
    <text x="862" y="217" fill="#eff6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Redis</text>
    <text x="862" y="260" fill="#fffbeb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">.env</text>
    <text x="862" y="116" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Bedolaga</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="988" y="112" width="150" height="138" rx="24" fill="url(#telegram)" stroke="#bae6fd" stroke-opacity="0.45"/>
    <path d="M1026 184L1102 150L1089 219L1062 199L1046 215L1048 193L1026 184Z" fill="#e0f2fe"/>
    <path d="M1048 193L1102 150L1062 199" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1063" y="270" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Telegram delivery</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="958" y="292" width="206" height="52" rx="16" fill="#0b1728" stroke="#274965"/>
    <circle cx="987" cy="318" r="9" fill="#22c55e"/>
    <text x="1011" y="314" fill="#93a9bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">timer</text>
    <text x="1011" y="332" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">active</text>
    <text x="1136" y="323" fill="#fde68a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="end">every 6h</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="445" y="332" width="116" height="28" rx="9" fill="#12344a"/>
    <text x="503" y="351" fill="#bfdbfe" text-anchor="middle">Docker Caddy</text>
    <rect x="576" y="332" width="104" height="28" rx="9" fill="#143b2d"/>
    <text x="628" y="351" fill="#bbf7d0" text-anchor="middle">SHA256</text>
    <rect x="695" y="332" width="122" height="28" rx="9" fill="#3b2f13"/>
    <text x="756" y="351" fill="#fde68a" text-anchor="middle">GPG optional</text>
    <rect x="832" y="332" width="94" height="28" rx="9" fill="#172554"/>
    <text x="879" y="351" fill="#dbeafe" text-anchor="middle">USD/RUB</text>
  </g>
</svg>
